name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - name: Run tests
        shell: bash
        run: |
          set +e
          python tests/test_parquet_viewer.py > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then
            python -c "import sys; t=open('test-output.txt').read()[-6000:]; print('::error title=Test output::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $status
      - run: pqv --version
